; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 2000000
;upload_port = /dev/ttyUSB0
lib_deps = 
	https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.0
	miguelbalboa/MFRC522@^1.4.10
	https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	adafruit/Adafruit NeoPixel@^1.15.1
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder
build_flags = 
	-D CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON=y
	-D CONFIG_BOOTLOADER_SKIP_VALIDATE_ALWAYS=y

[env:timon]
build_flags = 
    ${env.build_flags}
    -D BOX_NAME=\"Timon-Box\" 
	-D RKS_THRESHOLD=500 
	-D LKS_THRESHOLD=5000 

[env:julius]
build_flags = 
    ${env.build_flags}
	-D BOX_NAME=\"Julius-Box\" 
	-D RKS_THRESHOLD=1000 
	-D LKS_THRESHOLD=1000
