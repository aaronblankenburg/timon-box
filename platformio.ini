; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@^6.11.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 2000000
;upload_port = /dev/ttyUSB0
lib_deps = 
	https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.0
	miguelbalboa/MFRC522@^1.4.10
	https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	adafruit/Adafruit NeoPixel@^1.15.1
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder
build_flags = 
	-D CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON=y
	-D CONFIG_BOOTLOADER_SKIP_VALIDATE_ALWAYS=y

[env:timon]
build_flags = 
    ${env.build_flags}
    -D BOX_NAME=\"Timon-Box\" 
    -D BOX_COLOR=\"#0071e3\"    ; favicon: blue, so the two boxes differ in the browser's tabs
	; knock sensors (see README): thick, stiff panels, gentle presses are small
	-D RKS_THRESHOLD=10000       ; area (ADC counts * ms) one uninterrupted hump has to reach, lower = more sensitive
	-D LKS_THRESHOLD=10000
	-D KNOCK_ON_LEVEL=100       ; counts a hump has to rise above; it ends once below 3/5 of this
	-D KNOCK_MIN_PRESS_MS=25    ; an uninterrupted hump this long is a press
	-D KNOCK_MAX_GAP_US=700     ; dips shorter than this do not end a hump

[env:julius]
build_flags = 
    ${env.build_flags}
	-D BOX_NAME=\"Julius-Box\" 
	-D BOX_COLOR=\"#e8720c\"    ; favicon: orange
	; knock sensors (see README): thin panels, music shakes them hard, so everything is less sensitive
	-D RKS_THRESHOLD=10000      ; music never reaches 180 counts here, so a quick firm tap is the only thing this catches
	-D LKS_THRESHOLD=10000
	-D KNOCK_ON_LEVEL=300
	-D KNOCK_MIN_PRESS_MS=25
	-D KNOCK_MAX_GAP_US=300
